<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftStack — Softly Software Engineering Startup Mockup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F8FAFC;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: #F8FAFC;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #2563EB;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-inner {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(37, 99, 235, 0.2);
      color: #93C5FD;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .switcher {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px;
      border-radius: 999px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tab-btn:hover {
      color: #FFFFFF;
    }
    .tab-btn.active {
      background: #2563EB;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    .links-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .external-link {
      font-size: 0.82rem;
      font-weight: 600;
      color: #94A3B8;
      text-decoration: none;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .external-link:hover {
      border-color: #2563EB;
      color: #FFFFFF;
    }
    .frame-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 65px);
      border: none;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #F8FAFC;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="brand-wrap">
      <div class="logo-dot"><div class="logo-inner"></div></div>
      <div class="brand">DraftStack.</div>
      <span class="badge">Softly Theme</span>
    </div>

    <div class="switcher">
      <button class="tab-btn active" id="btn-opt1" onclick="switchOption(1)">
        DraftStack: Thoughtful Software Studio
      </button>
      <button class="tab-btn" id="btn-opt2" onclick="switchOption(2)">
        Softly Baseline Template
      </button>
    </div>

    <div class="links-group">
      <a class="external-link" id="canvas-link" href="https://superdesign.dev/teams/c6b40858-be18-48fa-ac1c-71de159321d8/projects/632946ce-506e-40a0-8420-04db05a926ae" target="_blank" rel="noopener">Open Superdesign Canvas ↗</a>
      <a class="external-link" id="preview-link" href="https://p.superdesign.dev/draft/8642d4c2-2322-491d-8f15-ac9a2d7fa234" target="_blank" rel="noopener">Open Standalone ↗</a>
    </div>
  </header>

  <div class="frame-container">
    <iframe id="preview-frame" src="index.html"></iframe>
  </div>

  <script>
    const urls = {
      1: "index.html",
      2: "https://p.superdesign.dev/draft/27bb1512-ff88-4458-8027-8f2abd84dacd"
    };

    function switchOption(num) {
      document.getElementById('btn-opt1').classList.toggle('active', num === 1);
      document.getElementById('btn-opt2').classList.toggle('active', num === 2);
      document.getElementById('preview-frame').src = urls[num];
      document.getElementById('preview-link').href = urls[num];
    }
  </script>
</body>
</html>

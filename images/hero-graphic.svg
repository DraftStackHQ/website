<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow1" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b5bfd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b5bfd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="75%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#3b5bfd" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3b5bfd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b7dff" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#5b7dff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8fa5ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="nodeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b7280" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4f6bff" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="#0a0b10"/>
  <rect width="1600" height="1000" fill="url(#bgGlow1)"/>
  <rect width="1600" height="1000" fill="url(#bgGlow2)"/>

  <!-- scattered noisy nodes (raw inputs) -->
  <g opacity="0.85">
    <line x1="140" y1="260" x2="220" y2="410" stroke="#4b4f5c" stroke-width="1.5"/>
    <line x1="220" y1="410" x2="160" y2="560" stroke="#4b4f5c" stroke-width="1.5"/>
    <line x1="160" y1="560" x2="300" y2="620" stroke="#4b4f5c" stroke-width="1.5"/>
    <line x1="140" y1="260" x2="300" y2="620" stroke="#3a3d47" stroke-width="1"/>
    <line x1="220" y1="410" x2="360" y2="360" stroke="#3a3d47" stroke-width="1"/>
    <line x1="360" y1="360" x2="300" y2="620" stroke="#3a3d47" stroke-width="1"/>
    <line x1="360" y1="360" x2="440" y2="480" stroke="#4b4f5c" stroke-width="1.5"/>
    <line x1="440" y1="480" x2="300" y2="620" stroke="#3a3d47" stroke-width="1"/>

    <circle cx="140" cy="260" r="6" fill="#8b8f9c"/>
    <circle cx="220" cy="410" r="8" fill="#a1a5b0"/>
    <circle cx="160" cy="560" r="5" fill="#8b8f9c"/>
    <circle cx="300" cy="620" r="7" fill="#9195a2"/>
    <circle cx="360" cy="360" r="6" fill="#a1a5b0"/>
    <circle cx="440" cy="480" r="9" fill="#b5b9c4"/>
  </g>

  <!-- transition nodes fading from grey to blue -->
  <g opacity="0.95">
    <line x1="440" y1="480" x2="560" y2="440" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="560" y1="440" x2="620" y2="520" stroke="url(#nodeFade)" stroke-width="1.5"/>
    <line x1="620" y1="520" x2="720" y2="500" stroke="#5b7dff" stroke-width="1.5"/>
    <line x1="560" y1="440" x2="480" y2="360" stroke="#5a6270" stroke-width="1.2"/>

    <circle cx="560" cy="440" r="7" fill="#7d8bb0"/>
    <circle cx="620" cy="520" r="8" fill="#5b7dff"/>
    <circle cx="480" cy="360" r="5" fill="#7d8bb0"/>
    <circle cx="720" cy="500" r="9" fill="#5b7dff" filter="url(#glow)"/>
  </g>

  <!-- clean signal wave (clear signal) -->
  <path d="M 720 500 C 820 460, 880 380, 960 400 C 1040 420, 1080 560, 1160 540 C 1240 520, 1280 420, 1380 440 C 1440 452, 1460 470, 1500 460"
        fill="none" stroke="url(#waveStroke)" stroke-width="4" filter="url(#glow)"/>

  <!-- soft particle dots along the clear signal path -->
  <g fill="#8fa5ff">
    <circle cx="820" cy="452" r="4" opacity="0.9"/>
    <circle cx="960" cy="400" r="5" opacity="0.95" filter="url(#glow)"/>
    <circle cx="1080" cy="560" r="4" opacity="0.8"/>
    <circle cx="1160" cy="540" r="5" opacity="0.95" filter="url(#glow)"/>
    <circle cx="1280" cy="420" r="4" opacity="0.85"/>
    <circle cx="1380" cy="440" r="5" opacity="0.95" filter="url(#glow)"/>
    <circle cx="1500" cy="460" r="6" opacity="1" filter="url(#glow)"/>
  </g>

  <!-- faint grid lines on the right, suggesting order/structure -->
  <g stroke="#2a3350" stroke-width="1" opacity="0.5">
    <line x1="900" y1="120" x2="900" y2="880"/>
    <line x1="1080" y1="120" x2="1080" y2="880"/>
    <line x1="1260" y1="120" x2="1260" y2="880"/>
    <line x1="1440" y1="120" x2="1440" y2="880"/>
  </g>

  <!-- ambient soft glow blobs for atmosphere -->
  <circle cx="420" cy="300" r="180" fill="#3b5bfd" opacity="0.06" filter="url(#softBlur)"/>
  <circle cx="1200" cy="620" r="220" fill="#3b5bfd" opacity="0.08" filter="url(#softBlur)"/>
</svg>

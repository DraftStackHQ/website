<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="faintGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b5bfd" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3b5bfd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6bff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c93ff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- transparent background, just the glow + node illustration -->
  <rect width="900" height="700" fill="url(#faintGlow)"/>

  <g filter="url(#glowSoft)">
    <line x1="250" y1="120" x2="400" y2="240" stroke="url(#lineStroke)" stroke-width="2"/>
    <line x1="400" y1="240" x2="320" y2="390" stroke="url(#lineStroke)" stroke-width="2"/>
    <line x1="400" y1="240" x2="550" y2="300" stroke="url(#lineStroke)" stroke-width="2"/>
    <line x1="550" y1="300" x2="680" y2="200" stroke="url(#lineStroke)" stroke-width="2"/>
    <line x1="550" y1="300" x2="620" y2="440" stroke="url(#lineStroke)" stroke-width="2"/>
    <line x1="320" y1="390" x2="480" y2="480" stroke="url(#lineStroke)" stroke-width="1.5"/>
    <line x1="480" y1="480" x2="620" y2="440" stroke="url(#lineStroke)" stroke-width="1.5"/>

    <circle cx="250" cy="120" r="8" fill="#7c93ff"/>
    <circle cx="400" cy="240" r="12" fill="#5b7dff"/>
    <circle cx="320" cy="390" r="7" fill="#7c93ff"/>
    <circle cx="550" cy="300" r="10" fill="#5b7dff"/>
    <circle cx="680" cy="200" r="6" fill="#8fa5ff"/>
    <circle cx="620" cy="440" r="9" fill="#7c93ff"/>
    <circle cx="480" cy="480" r="6" fill="#8fa5ff"/>
  </g>
</svg>
